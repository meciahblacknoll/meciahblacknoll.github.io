<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light dark}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Murphy Bed Build Steps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#efe9df;--panel:#f8f5ee;--ink:#2a2420;--muted:#6f655b;--line:#d9d0c2;--accent:#8a5a2b;--accent-ink:#fff;--chip:#e6ddcf;--ok:#3f7a4a;--warn:#b0392e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c1917;--panel:#26211e;--ink:#efe7db;--muted:#a79c8e;--line:#3b332d;--accent:#d9a35f;--accent-ink:#1c1917;--chip:#342c26;--ok:#7fc08a;--warn:#e07a6e}}
:root[data-theme="dark"]{--bg:#1c1917;--panel:#26211e;--ink:#efe7db;--muted:#a79c8e;--line:#3b332d;--accent:#d9a35f;--accent-ink:#1c1917;--chip:#342c26;--ok:#7fc08a;--warn:#e07a6e}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:12px 16px 6px}
h1{font:600 22px/1.1 "Fraunces",Georgia,serif;margin:0}
header .sub{color:var(--muted);font-size:13px}
#wrap{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;padding:0 16px;min-height:0}
@media (max-width:900px){#wrap{grid-template-columns:1fr;grid-template-rows:minmax(300px,55vh) auto}}
#stage{position:relative;border-radius:10px;overflow:hidden;background:#cfc6b8;min-height:300px}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:12px;top:10px;font-size:12px;color:#2a2420;background:rgba(248,245,238,.88);padding:6px 9px;border-radius:6px}
#panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;min-height:0}
#panel h2{font:600 17px/1.2 "Fraunces",Georgia,serif;margin:0 0 4px}
#panel .n{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#panel h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
#panel ul{margin:0;padding-left:18px}
#panel li{margin:3px 0}
#panel .check li::marker{color:var(--ok);content:"✓ "}
#panel .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12px}
.chip.w{color:var(--warn)}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-width:96px}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#steps{display:flex;gap:4px;flex-wrap:wrap}
#steps button{padding:4px 9px;font-size:12px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
</style>

<header><h1>Murphy Bed Build Steps</h1><span class="sub">Rev E, King floor-pivot. Each step flies its parts in and drives its fasteners. Drag to orbit, scroll to zoom.</span></header>
<div id="wrap">
  <div id="stage"><canvas id="c"></canvas><div id="hud"></div></div>
  <aside id="panel"></aside>
</div>
<div class="bar">
  <button id="prev">Back</button><button id="play" class="primary">Play all</button><button id="next">Next</button>
  <span class="lbl">Jump</span><div id="steps"></div>
  <span class="lbl">Show</span><button id="t-studs" class="on">Studs</button><button id="t-dims">Dimensions</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const R={X:127,Y:154,Z:108};
const P=(x,y,z)=>new THREE.Vector3(x,z,-y);
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xcfc6b8);
const camera=new THREE.PerspectiveCamera(50,1,1,2000);

function woodTex(base,dark,w=512){const c=document.createElement('canvas');c.width=c.height=w;const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,w,w);for(let y=0;y<w;y+=2){g.globalAlpha=0.05+0.12*Math.abs(Math.sin(y*0.045)+0.4*Math.sin(y*0.17));g.fillStyle=dark;g.fillRect(0,y,w,1+Math.random()*2);}g.globalAlpha=1;const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
function noiseTex(base,grain,scale,w=256){const c=document.createElement('canvas');c.width=c.height=w;const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,w,w);for(let i=0;i<w*w*0.35;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*grain})`;g.fillRect(Math.random()*w,Math.random()*w,1,1);}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(scale,scale);return t;}
const M={
  wall:new THREE.MeshStandardMaterial({color:0xe8e2d6,roughness:0.95}),
  carpet:new THREE.MeshStandardMaterial({map:noiseTex('#a89c8c',0.25,10),roughness:1}),
  slab:new THREE.MeshStandardMaterial({color:0x9a9690,roughness:1}),
  stud:new THREE.MeshStandardMaterial({color:0xc9a57a,transparent:true,opacity:0.35,roughness:1}),
  pine:new THREE.MeshStandardMaterial({map:woodTex('#d8ab6a','#7a4e22'),roughness:0.7}),
  ply:new THREE.MeshStandardMaterial({map:woodTex('#e3c99a','#9a7a4a'),roughness:0.8}),
  hard:new THREE.MeshStandardMaterial({color:0x6b5a4a,roughness:0.9}),
  walnut:new THREE.MeshStandardMaterial({map:woodTex('#5a3b26','#241509'),roughness:0.55}),
  steel:new THREE.MeshStandardMaterial({color:0x3a3f45,roughness:0.4,metalness:0.7}),
  zinc:new THREE.MeshStandardMaterial({color:0xb9bfc4,roughness:0.35,metalness:0.8}),
  bolt:new THREE.MeshStandardMaterial({color:0xd8b74a,roughness:0.4,metalness:0.6}),   // highlighted fasteners
  rubber:new THREE.MeshStandardMaterial({color:0x222,roughness:1}),
  matt:new THREE.MeshStandardMaterial({color:0xf1efe8,roughness:1}),
  rope:new THREE.LineBasicMaterial({color:0xb0392e}),
  chalk:new THREE.LineBasicMaterial({color:0x2b6cb0}),
  strap:new THREE.MeshStandardMaterial({color:0xd9a35f,roughness:1}),
  led:new THREE.MeshStandardMaterial({color:0xffd9a0,emissive:0xffb060,emissiveIntensity:1.2}),
};
function mesh(parent,geo,mat,pos,shadow=true){const m=new THREE.Mesh(geo,mat);m.position.copy(pos);m.castShadow=shadow;m.receiveShadow=true;parent.add(m);return m;}
// plan-coordinate box: corner (x,y,z) size (dx,dy,dz)
function pbox(parent,x,y,z,dx,dy,dz,mat,shadow=true){return mesh(parent,new THREE.BoxGeometry(dx,dz,dy),mat,P(x+dx/2,y+dy/2,z+dz/2),shadow);}

// ---------- room shell (always visible) ----------
const shell=new THREE.Group(); scene.add(shell);
pbox(shell,0,0,-0.5,R.X,R.Y,0.5,M.carpet,false);
const wallT=4;
pbox(shell,-wallT,R.Y,0,R.X+2*wallT,wallT,R.Z,M.wall);
pbox(shell,-wallT,0,0,wallT,R.Y,R.Z,M.wall); pbox(shell,R.X,0,0,wallT,R.Y,R.Z,M.wall);
const studs=new THREE.Group(); shell.add(studs);
for(let x=0.75;x<R.X;x+=16) pbox(studs,x-0.75,R.Y+0.05,0,1.5,3.5,R.Z,M.stud,false);   // ASSUMED 16" o.c. from the left wall; verify with a finder

// ---------- geometry constants (rev E) ----------
const boxAlong=79.5, boxOut=83.5, boxH=9.25, deck=0.75, gap=3, upT=1.5, upD=9.25;
const bedX0=(R.X-boxAlong)/2;                  // 23.75
const ledgY=R.Y-1.5;                            // ledger face plane (ledgers are 1.5" thick on the drywall)
const upY0=ledgY-upD;                           // uprights sit against the ledgers
const padH=3.0;                                      // rev E.4: doubled 2x8 pad, 3 in tall
const axY=R.Y-21, axZ=padH+1.44, axIn=2.0, axUp=axZ-0.5;   // axle 21 in from the drywall, 4.44 in above the slab, 3.94 in up the rail (bolt edge distance 1.6 in; standing bed 2.7 in clear of the ledgers)
const xUpL=bedX0-gap-upT, xUpR=bedX0+boxAlong+gap;
const pbXL=bedX0-1.1-1.5, pbXR=bedX0+boxAlong+1.1;             // pillow block (1.5 wide) just outside the 1.1 in flange bearing
const padXL=pbXL+1.5-10, padXR=pbXR;                            // 10 in pads ending flush with the pillow blocks' outer faces: clear of the box end and the flange sweep (rev E.3)

// ---------- parts registry ----------
const parts={}; const fast={}; let fastSeq=0;
function part(id,build){const g=new THREE.Group();g.visible=false;scene.add(g);build(g);g.userData.final=g.position.clone();parts[id]=g;return g;}
function fastener(id,pos,axis,len,d,mat){ // pos: plan head position when seated; axis: plan unit vector pointing INTO the material
  const g=new THREE.Group(); g.visible=false; scene.add(g);
  const shank=new THREE.Mesh(new THREE.CylinderGeometry(d/2,d/2,len,10),mat||M.bolt); shank.position.y=-len/2; g.add(shank);
  const head=new THREE.Mesh(new THREE.CylinderGeometry(d*1.1,d*1.1,d*0.6,12),mat||M.bolt); head.position.y=d*0.3; g.add(head);
  const a=P(axis[0],axis[1],axis[2]).sub(P(0,0,0)).normalize();
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0),a);
  g.position.copy(P(pos[0],pos[1],pos[2])); g.userData.final=g.position.clone(); g.userData.axis=a;
  (fast[id]=fast[id]||[]).push(g); return g;
}
const lag=(id,x,y,z,ax)=>fastener(id,[x,y,z],ax||[0,1,0],4,0.375);
const tap=(id,x,y,z)=>fastener(id,[x,y,z],[0,0,-1],2.75,0.25,M.zinc);
const carriage=(id,x,y,z)=>fastener(id,[x,y,z],[0,1,0],7,0.5);
const screw=(id,x,y,z,ax)=>fastener(id,[x,y,z],ax,3,0.2,M.zinc);
const thru=(id,x,y,z,ax)=>fastener(id,[x,y,z],ax,3,0.5);

// S1 ledgers, winch plate, brace cleat
part('ledgers',g=>{ for(const z of [46,84]) pbox(g,15.75,ledgY,z,96,1.5,5.5,M.pine); pbox(g,R.X/2-18,ledgY,96,36,1.5,7.25,M.pine); });
for(const z of [48.75,86.75]) for(let x=16.75;x<=112;x+=16) lag('ledgers',x,ledgY,z);
for(const x of [R.X/2-8,R.X/2+8]) for(const z of [98,101.5]) lag('ledgers',x,ledgY,z);
// S2 uprights + carriage bolts
part('uprights',g=>{ pbox(g,xUpL,upY0,0,upT,upD,90,M.pine); pbox(g,xUpR,upY0,0,upT,upD,90,M.pine); });
for(const x of [xUpL+0.75,xUpR+0.75]) for(const z of [47,50,85,88]) carriage('uprights',x,upY0+3,z);
// S3 chalk line, carpet cut, pads, pillow blocks, tapcons
part('layout',g=>{ const geo=new THREE.BufferGeometry().setFromPoints([P(2,axY,0.3),P(R.X-2,axY,0.3)]); g.add(new THREE.Line(geo,M.chalk));
  for(const x of [padXL,padXR]) pbox(g,x-1,axY-5.6,-0.45,14,11.2,0.46,M.slab,false); });
part('pads',g=>{ for(const x of [padXL,padXR]){ pbox(g,x,axY-3.625,0,10,7.25,1.5,M.pine); pbox(g,x,axY-3.625,1.5,10,7.25,1.5,M.pine); } });   // two 2x8 layers, glued and screwed
for(const x of [padXL,padXR]) for(const dx of [1.5,5,8.5]) for(const dy of [-2.4,2.4]) fastener('pads',[x+dx,axY+dy,padH],[0,0,-1],4.0,0.25,M.zinc);   // 1/4 x 4 in Tapcons through both layers
part('pillows',g=>{ for(const x of [pbXL,pbXR]){ pbox(g,x,axY-2.75,padH,1.5,5.5,1.6,M.steel); const h=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,1.5,20),M.steel); h.rotation.z=Math.PI/2; h.position.copy(P(x+0.75,axY,axZ)); g.add(h);} });
for(const x of [pbXL,pbXR]) for(const dy of [-2.06,2.06]) thru('pillows',x+0.75,axY+dy,padH+1.8,[0,0,-1]);
// S4 winch, fairlead, arm, brace, pulley
part('winch',g=>{ pbox(g,R.X/2-5.7,ledgY-4.3,97.5,11.4,4.3,4.5,M.steel); pbox(g,R.X/2-2.5,ledgY-5.3,98.5,5,1,2.5,M.zinc);      // winch + hawse fairlead
  pbox(g,R.X/2-0.75,R.Y-22.5,99.25,1.5,21,5.5,M.pine);                                                                       // pulley arm 2x6, tip 22.5 in out from the drywall (1.5 past the axle)
  const br=new THREE.Mesh(new THREE.BoxGeometry(1.5,23.3,3.5),M.pine); br.position.copy(P(R.X/2,R.Y-11.5,93)); br.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),P(0,-20,12).sub(P(0,0,0)).normalize()); br.castShadow=true; g.add(br);   // knee brace: arm tip down to the upper ledger at 87 in, stays above the 84.4 in standing box top
  const pu=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,1,24),M.steel); pu.rotation.z=Math.PI/2; pu.position.copy(P(R.X/2,R.Y-22,99)); g.add(pu); });
for(const x of [R.X/2-4,R.X/2+4]) lag('winch',x,ledgY-4.3,99.75);
for(const z of [100.5,103]) thru('winch',R.X/2-0.75,ledgY-1,z,[1,0,0]);
lag('winch',R.X/2,R.Y-21,98.8,[0,0.85,0.5]); lag('winch',R.X/2,ledgY,87.5,[0,1,0]);
// S5 frame (right side up, in place): rails, joists, blocking
const bedG=new THREE.Group(); scene.add(bedG);       // everything that swings
const pivot=new THREE.Group(); pivot.position.copy(P(bedX0,axY,axZ)); bedG.add(pivot);
const bed=new THREE.Group(); bed.position.set(0,-axUp,-axIn); pivot.add(bed);
function bpart(id,build){const g=new THREE.Group();g.visible=false;bed.add(g);build(g);g.userData.final=g.position.clone();g.userData.local=true;parts[id]=g;return g;}
function bbox(g,x,y,z,dx,dy,dz,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(dx,dy,dz),mat);m.position.set(x+dx/2,y+dy/2,z+dz/2);m.castShadow=m.receiveShadow=true;g.add(m);return m;}   // bed local: x along, y up, z out
bpart('rails',g=>{ bbox(g,0,0,0,1.5,boxH,boxOut,M.pine); bbox(g,boxAlong-1.5,0,0,1.5,boxH,boxOut,M.pine); bbox(g,1.5,0,0,boxAlong-3,boxH,1.5,M.pine); bbox(g,1.5,0,boxOut-1.5,boxAlong-3,boxH,1.5,M.pine); });
bpart('joists',g=>{ for(const z of [20,41,62]) bbox(g,1.5,boxH-5.5,z-0.75,boxAlong-3,5.5,1.5,M.pine); for(const x of [1.5,20.5,39.5,58.5]) bbox(g,x,boxH-5.5,41.75,19,5.5,1.5,M.pine); });
// S6 flange bearings, backer plates, stubs, eye bolt
bpart('flanges',g=>{ for(const x of [-1.1,boxAlong]){ bbox(g,x,axUp-2.55,axIn-1.3,1.1,5.1,2.6,M.steel); }   // UCFL205 2-bolt oval, lobes VERTICAL: bolts 2 in from the rail end at 2 and 5.9 in up for(const x of [1.5,boxAlong-1.75]) bbox(g,x,axUp-3,axIn-1.5,0.25,6,3,M.zinc);
  for(const x of [-0.1,boxAlong+0.1]){ const s=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,6,16),M.zinc); s.rotation.z=Math.PI/2; s.position.set(x,axUp,axIn); g.add(s);}
  bbox(g,2,boxH+deck,boxOut-2.5,boxAlong-4,3,0.75,M.walnut);                                     // 3 in foot lip inside the far rail: raises the rope hook so the rope line crosses the pivot BELOW over-center
  const eye=new THREE.Mesh(new THREE.TorusGeometry(0.9,0.22,8,16),M.steel); eye.position.set(boxAlong/2,boxH+deck+3.6,boxOut-2.1); g.add(eye); });   // eye bolt at the top edge of the foot lip
// S7 keepers, barrel bolts, bump stops, top limit switch
part('keepers',g=>{ const deckY=axY+(boxH-axUp)+deck;   // 140.65: deck face plane when standing
  for(const x of [xUpL+upT,xUpR-1.5]) for(const z of [58,78]) pbox(g,x,deckY-10.15,z,1.5,152.5-(deckY-10.15),5.5,M.pine);   // 2x6 keeper arms on the uprights' inner faces, projecting into the room beside the box ends
  for(const x of [xUpL+upT+1.5,xUpR-1.5-2.75]) for(const z of [59,79]) pbox(g,x,deckY,z,2.75,2,3.5,M.rubber);              // rubber stop blocks: the standing deck edge lands on them
  for(const x of [xUpL+upT+1.5,xUpR-1.5-0.125]) for(const z of [60]) pbox(g,x,deckY-7,z,0.125,1.5,1.5,M.zinc);           // barrel-bolt strike plates (thin), lower arms only
  pbox(g,xUpL+upT+1.5,deckY-4,63.5,1,1.5,1.5,M.rubber); });                                                               // top limit switch
for(const x of [xUpL+0.75,xUpR+0.75]) for(const z of [60.75,80.75]) for(const y of [145,150]) lag('keepers',x+(x<60?1.5:0),y,z,[x<60?-1:1,0,0]);
// S8 skin (installed while standing), S9 deck
bpart('skin',g=>{ bbox(g,0,-0.25,0,boxAlong,0.25,boxOut,M.hard); });
bpart('deck',g=>{ bbox(g,0,boxH,0,48,deck,boxOut,M.ply); bbox(g,48,boxH,0,boxAlong-48,deck,boxOut,M.ply); for(const x of [10,30,50,70]) for(const z of [15,40,65]){ const h=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.9,10),M.rubber); h.position.set(x,boxH+deck/2,z); g.add(h);} });
// S10 safety straps + bottom limit switch (static props)
part('safety',g=>{ for(const x of [xUpL+upT+0.5,xUpR-0.5]) pbox(g,x-0.4,upY0+3,66,0.8,0.8,10,M.strap); pbox(g,padXL+5,axY+5,1.5,2,1.5,1.5,M.rubber); });
// S11 headboard
bpart('headboard',g=>{ bbox(g,0,boxH,0,boxAlong,10.75,0.75,M.walnut);   // riser: 3/4 ply standing on the wall-side rail up to the mattress-top plane; doubles as the head-end mattress stop
  bbox(g,2,boxH+9.4,0.75,boxAlong-4,1.25,0.08,M.zinc);                                  // lower hinge leaf, surface-mounted on the riser's mattress face
  for(const x of [14,41,68]){ const e=new THREE.Mesh(new THREE.TorusGeometry(0.6,0.15,8,14),M.steel); e.position.set(x,boxH+9.0,1.0); g.add(e); }   // mattress-strap eyes moved up onto the riser
  const hb=new THREE.Group(); hb.position.set(0,boxH+10.75,0.75); g.add(hb);        // hinge pin: top mattress-side corner of the riser
  const p=new THREE.Mesh(new THREE.BoxGeometry(boxAlong,26,0.75),M.walnut); p.position.set(boxAlong/2,13,-0.375); p.castShadow=true; hb.add(p);
  const leaf=new THREE.Mesh(new THREE.BoxGeometry(boxAlong-4,1.25,0.08),M.zinc); leaf.position.set(boxAlong/2,0.65,0.04); hb.add(leaf);   // upper hinge leaf on the panel's mattress face
  for(const x of [6,boxAlong-6]){ const body=new THREE.Mesh(new THREE.BoxGeometry(1.2,4,0.7),M.zinc); body.position.set(x,3.5,0.35); hb.add(body); const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,5.5,10),M.zinc); rod.position.set(x,2.5,0.35); hb.add(rod); }   // two vertical drop bolts: thrown DOWN across the hinge line into holes in the riser top to lock the panel upright
  const hinge=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,boxAlong-4,10),M.zinc); hinge.rotation.z=Math.PI/2; hinge.position.set(boxAlong/2,boxH+10.75,0.75); g.add(hinge); g.userData.hb=hb; });
// S12 mattress + topper + straps
bpart('mattress',g=>{ bbox(g,1.75,boxH+deck,1.75,76,8,80,M.matt); bbox(g,1.75,boxH+deck+8,1.75,76,2,80,M.matt); for(const z of [14,41,68]){ bbox(g,0.5,boxH+deck+10,z,boxAlong-1,0.15,1.5,M.strap); bbox(g,0.5,boxH+deck,z,0.15,10,1.5,M.strap); bbox(g,boxAlong-0.65,boxH+deck,z,0.15,10,1.5,M.strap);} });

// rope
const rope=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),M.rope); rope.visible=false; scene.add(rope);

// cumulative visibility: all parts of steps <= i are shown
const panel=document.getElementById('panel'), hud=document.getElementById('hud'), stepsBar=document.getElementById('steps');
steps.forEach((s,i)=>{const b=document.createElement('button'); b.textContent=i; b.title=s.t; b.addEventListener('click',()=>go(i)); stepsBar.appendChild(b);});
let cur=-1, anims=[], camFrom=null, camTo=null, camT=1, swingA=0, playing=false, dwell=0;
let tgt=P(63,100,40); camera.position.copy(P(63,-120,70)); camera.lookAt(tgt);
function ease(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function go(i){
  i=Math.max(0,Math.min(steps.length-1,i)); const forward=i>cur; cur=i; const s=steps[i];
  // visibility
  Object.values(parts).forEach(g=>g.visible=false); Object.values(fast).flat().forEach(f=>f.visible=false);
  for(let k=0;k<=i;k++){ steps[k].parts.forEach(id=>parts[id].visible=true); steps[k].fast.forEach(id=>(fast[id]||[]).forEach(f=>f.visible=true)); }
  anims=[]; const now=performance.now();
  if(forward){
    s.parts.forEach((id,n)=>{ const g=parts[id]; const off=g.userData.local? new THREE.Vector3(0,30,0): new THREE.Vector3(0,30,0); g.position.copy(g.userData.final).add(off); anims.push({g,from:g.position.clone(),to:g.userData.final.clone(),t0:now+n*250,d:1100}); });
    let n=0; s.fast.forEach(id=>(fast[id]||[]).forEach(f=>{ f.position.copy(f.userData.final).add(f.userData.axis.clone().multiplyScalar(-6)); anims.push({g:f,from:f.position.clone(),to:f.userData.final.clone(),t0:now+1100+n*140,d:320}); n++; }));
  } else { Object.values(parts).forEach(g=>g.position.copy(g.userData.final)); Object.values(fast).flat().forEach(f=>f.position.copy(f.userData.final)); }
  camFrom={eye:camera.position.clone(),tgt:tgt.clone()}; camTo=s.cam; camT=0;
  // swing state: steps 8, 9 raise the frame; others down; final step animates
  swingTarget = (i===8||i===9)? 90 : 0; swingLoop = !!s.swing; foldDemo = s.demo==='fold'; foldT=0;
  const nF=s.fast.reduce((a,id)=>a+(fast[id]||[]).length,0);
  panel.innerHTML=`<div class="n">Step ${i} of ${steps.length-1}</div><h2>${s.t}</h2>
   <h3>Do</h3><ul>${s.do.map(x=>`<li>${x}</li>`).join('')}</ul>
   <h3>Check before moving on</h3><ul class="check">${s.check.map(x=>`<li>${x}</li>`).join('')}</ul>
   <div class="meta">${s.people?`<span class="chip">People: ${s.people}</span>`:''}${s.tools?`<span class="chip">Tools: ${s.tools}</span>`:''}${nF?`<span class="chip">${nF} fasteners</span>`:''}${i===0?'<span class="chip w">Assumptions to verify</span>':''}</div>`;
  panel.scrollTop=0;
  hud.textContent=`Step ${i}: ${s.t}`;
  stepsBar.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('on',k===i));
  dwell=0;
}
let swingTarget=0, swingLoop=false, swingDir=1, foldDemo=false, foldT=0;
document.getElementById('prev').addEventListener('click',()=>{playing=false;play.textContent='Play all';go(cur-1);});
document.getElementById('next').addEventListener('click',()=>{playing=false;play.textContent='Play all';go(cur+1);});
const play=document.getElementById('play'); play.addEventListener('click',()=>{ playing=!playing; play.textContent=playing?'Pause':'Play all'; if(playing&&cur>=steps.length-1) go(0); });
document.getElementById('t-studs').addEventListener('click',e=>{e.target.classList.toggle('on'); studs.visible=e.target.classList.contains('on');});
document.getElementById('t-dims').addEventListener('click',e=>{e.target.classList.toggle('on'); dims.visible=e.target.classList.contains('on');});
// orbit
let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointerup',()=>drag=null);
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=(e.clientX-drag.x)*0.005,dy=(e.clientY-drag.y)*0.005;drag={x:e.clientX,y:e.clientY};camT=1;const off=camera.position.clone().sub(tgt);const sph=new THREE.Spherical().setFromVector3(off);sph.theta-=dx;sph.phi=Math.min(Math.PI-0.05,Math.max(0.05,sph.phi+dy));off.setFromSpherical(sph);camera.position.copy(tgt).add(off);camera.lookAt(tgt);});
canvas.addEventListener('wheel',e=>{e.preventDefault();camT=1;const off=camera.position.clone().sub(tgt);off.multiplyScalar(1+Math.sign(e.deltaY)*0.08);if(off.length()>15&&off.length()<900){camera.position.copy(tgt).add(off);camera.lookAt(tgt);}},{passive:false});

function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==w||canvas.height!==h){renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}}
let last=performance.now();
function frame(t){const dt=Math.min(0.05,(t-last)/1000);last=t;resize();
  // part / fastener animations
  let busy=false; anims.forEach(a=>{const u=(t-a.t0)/a.d; if(u<0){a.g.position.copy(a.from);busy=true;} else if(u<1){a.g.position.lerpVectors(a.from,a.to,ease(u));busy=true;} else a.g.position.copy(a.to);});
  // camera
  if(camT<1){camT=Math.min(1,camT+dt/1.2);const k=ease(camT);camera.position.lerpVectors(camFrom.eye,camTo.eye,k);tgt.lerpVectors(camFrom.tgt,camTo.tgt,k);camera.lookAt(tgt);}
  // swing
  if(swingLoop){ swingA+=swingDir*20*dt; if(swingA>=90){swingA=90;swingDir=-1;} if(swingA<=0){swingA=0;swingDir=1;} }
  else { const d=swingTarget-swingA; if(Math.abs(d)>0.1){swingA+=Math.sign(d)*Math.min(Math.abs(d),25*dt);busy=true;} else swingA=swingTarget; }
  pivot.rotation.x=-THREE.MathUtils.degToRad(swingA);
  if(parts.headboard&&parts.headboard.userData.hb){ let f=Math.min(1,swingA/8); if(foldDemo){ foldT+=dt; const c=foldT%6; f = c<2? 0 : c<3.2? ease((c-2)/1.2) : c<4.5? 1 : ease(1-(c-4.5)/1.2); } parts.headboard.userData.hb.rotation.x=Math.PI/2*f; }   // folds forward onto the mattress; step 12 loops a fold demo
  updateRope(parts.flanges.visible && (swingA>0.5 || cur===7 || cur===8 || cur===9));
  if(playing){ if(!busy){ dwell+=dt; if(dwell>7){ if(cur<steps.length-1) go(cur+1); else {playing=false;play.textContent='Play all';} } } }
  renderer.render(scene,camera); requestAnimationFrame(frame);}
go(0); requestAnimationFrame(frame);
})();
