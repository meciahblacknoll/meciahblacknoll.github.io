<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light dark}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Murphy Bed Build Steps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#efe9df;--panel:#f8f5ee;--ink:#2a2420;--muted:#6f655b;--line:#d9d0c2;--accent:#8a5a2b;--accent-ink:#fff;--chip:#e6ddcf;--ok:#3f7a4a;--warn:#b0392e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c1917;--panel:#26211e;--ink:#efe7db;--muted:#a79c8e;--line:#3b332d;--accent:#d9a35f;--accent-ink:#1c1917;--chip:#342c26;--ok:#7fc08a;--warn:#e07a6e}}
:root[data-theme="dark"]{--bg:#1c1917;--panel:#26211e;--ink:#efe7db;--muted:#a79c8e;--line:#3b332d;--accent:#d9a35f;--accent-ink:#1c1917;--chip:#342c26;--ok:#7fc08a;--warn:#e07a6e}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:12px 16px 6px}
h1{font:600 22px/1.1 "Fraunces",Georgia,serif;margin:0}
header .sub{color:var(--muted);font-size:13px}
#wrap{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;padding:0 16px;min-height:0}
@media (max-width:900px){#wrap{grid-template-columns:1fr;grid-template-rows:minmax(300px,55vh) auto}}
#stage{position:relative;border-radius:10px;overflow:hidden;background:#cfc6b8;min-height:300px}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:12px;top:10px;font-size:12px;color:#2a2420;background:rgba(248,245,238,.88);padding:6px 9px;border-radius:6px}
#panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;min-height:0}
#panel h2{font:600 17px/1.2 "Fraunces",Georgia,serif;margin:0 0 4px}
#panel .n{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#panel h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
#panel ul{margin:0;padding-left:18px}
#panel li{margin:3px 0}
#panel .check li::marker{color:var(--ok);content:"✓ "}
#panel .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12px}
.chip.w{color:var(--warn)}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-width:96px}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#steps{display:flex;gap:4px;flex-wrap:wrap}
#steps button{padding:4px 9px;font-size:12px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
</style>

<header><h1>Murphy Bed Build Steps</h1><span class="sub">Rev F budget build: your queen, head to wall, 63.5 x 83.5 in box, two linear actuators. Each step flies its parts in and drives its fasteners. Drag to orbit, scroll to zoom.</span></header>
<div id="wrap">
  <div id="stage"><canvas id="c"></canvas><div id="hud"></div></div>
  <aside id="panel"></aside>
</div>
<div class="bar">
  <button id="prev">Back</button><button id="play" class="primary">Play all</button><button id="next">Next</button>
  <span class="lbl">Jump</span><div id="steps"></div>
  <span class="lbl">Show</span><button id="t-studs" class="on">Studs</button><button id="t-dims">Dimensions</button><button id="t-xray">X-ray</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const R={X:127,Y:154,Z:108};
const P=(x,y,z)=>new THREE.Vector3(x,z,-y);
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xcfc6b8);
const camera=new THREE.PerspectiveCamera(50,1,1,2000);

function woodTex(base,dark,w=512){const c=document.createElement('canvas');c.width=c.height=w;const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,w,w);for(let y=0;y<w;y+=2){g.globalAlpha=0.05+0.12*Math.abs(Math.sin(y*0.045)+0.4*Math.sin(y*0.17));g.fillStyle=dark;g.fillRect(0,y,w,1+Math.random()*2);}g.globalAlpha=1;const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
function noiseTex(base,grain,scale,w=256){const c=document.createElement('canvas');c.width=c.height=w;const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,w,w);for(let i=0;i<w*w*0.35;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*grain})`;g.fillRect(Math.random()*w,Math.random()*w,1,1);}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(scale,scale);return t;}
const M={
  wall:new THREE.MeshStandardMaterial({color:0xe8e2d6,roughness:0.95}),
  carpet:new THREE.MeshStandardMaterial({map:noiseTex('#a89c8c',0.25,10),roughness:1}),
  slab:new THREE.MeshStandardMaterial({color:0x9a9690,roughness:1}),
  stud:new THREE.MeshStandardMaterial({color:0xc9a57a,transparent:true,opacity:0.35,roughness:1}),
  pine:new THREE.MeshStandardMaterial({map:woodTex('#d8ab6a','#7a4e22'),roughness:0.7}),
  ply:new THREE.MeshStandardMaterial({map:woodTex('#e3c99a','#9a7a4a'),roughness:0.8}),
  hard:new THREE.MeshStandardMaterial({color:0x6b5a4a,roughness:0.9}),
  walnut:new THREE.MeshStandardMaterial({map:woodTex('#5a3b26','#241509'),roughness:0.55}),
  steel:new THREE.MeshStandardMaterial({color:0x3a3f45,roughness:0.4,metalness:0.7}),
  zinc:new THREE.MeshStandardMaterial({color:0xb9bfc4,roughness:0.35,metalness:0.8}),
  bolt:new THREE.MeshStandardMaterial({color:0xd8b74a,roughness:0.4,metalness:0.6}),   // highlighted fasteners
  rubber:new THREE.MeshStandardMaterial({color:0x222,roughness:1}),
  matt:new THREE.MeshStandardMaterial({color:0xf1efe8,roughness:1}),
  rope:new THREE.LineBasicMaterial({color:0xb0392e}),
  chalk:new THREE.LineBasicMaterial({color:0x2b6cb0}),
  strap:new THREE.MeshStandardMaterial({color:0xd9a35f,roughness:1}),
  led:new THREE.MeshStandardMaterial({color:0xffd9a0,emissive:0xffb060,emissiveIntensity:1.2}),
  holeM:new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:1}),
  osb:new THREE.MeshStandardMaterial({map:noiseTex('#c9a86a',0.5,6),roughness:0.95}),
  battery:new THREE.MeshStandardMaterial({color:0x2b2b30,roughness:0.6}),
  cord:new THREE.LineBasicMaterial({color:0x222}),
  path:new THREE.LineBasicMaterial({color:0xb0392e}),
  blade:new THREE.MeshStandardMaterial({color:0xe03a2a,emissive:0xa02010,emissiveIntensity:0.6}),
  cut:new THREE.LineBasicMaterial({color:0xe03a2a}),
};
function mesh(parent,geo,mat,pos,shadow=true){const m=new THREE.Mesh(geo,mat);m.position.copy(pos);m.castShadow=shadow;m.receiveShadow=true;parent.add(m);return m;}
// plan-coordinate box: corner (x,y,z) size (dx,dy,dz)
function pbox(parent,x,y,z,dx,dy,dz,mat,shadow=true){return mesh(parent,new THREE.BoxGeometry(dx,dz,dy),mat,P(x+dx/2,y+dy/2,z+dz/2),shadow);}

// ---------- room shell (always visible) ----------
const shell=new THREE.Group(); scene.add(shell);
pbox(shell,0,0,-0.5,R.X,R.Y,0.5,M.carpet,false);
const wallT=4;
pbox(shell,-wallT,R.Y,0,R.X+2*wallT,wallT,R.Z,M.wall);
pbox(shell,-wallT,0,0,wallT,R.Y,R.Z,M.wall); pbox(shell,R.X,0,0,wallT,R.Y,R.Z,M.wall);
const studs=new THREE.Group(); shell.add(studs);
for(let x=0.75;x<R.X;x+=16) pbox(studs,x-0.75,R.Y+0.05,0,1.5,3.5,R.Z,M.stud,false);   // ASSUMED 16" o.c. from the left wall; verify with a finder

// ---------- geometry constants (rev E) ----------
const boxAlong=63.5, boxOut=83.5, boxH=9.25, deck=0.75, gap=3, upT=1.5, upD=5.5;   // rev F budget build: queen box, 2x6 uprights
const bedX0=(R.X-boxAlong)/2;                  // 23.75
const ledgY=R.Y-1.5;                            // ledger face plane (ledgers are 1.5" thick on the drywall)
const upY0=ledgY-upD;                           // uprights sit against the ledgers
const padH=3.0;                                      // rev E.4: doubled 2x8 pad, 3 in tall
const axY=R.Y-21, axZ=padH+1.44, axIn=2.0, axUp=axZ-0.5;   // axle 21 in from the drywall, 4.44 in above the slab, 3.94 in up the rail (bolt edge distance 1.6 in; standing bed 2.7 in clear of the ledgers)
const xUpL=bedX0-gap-upT, xUpR=bedX0+boxAlong+gap;
const pbXL=bedX0-1.1-1.5, pbXR=bedX0+boxAlong+1.1;             // pillow block (1.5 wide) just outside the 1.1 in flange bearing
const padXL=pbXL+1.5-10, padXR=pbXR;                            // 10 in pads ending flush with the pillow blocks' outer faces: clear of the box end and the flange sweep (rev E.3)

// ---------- parts registry ----------
const parts={}; const fast={}; let fastSeq=0;
function part(id,build){const g=new THREE.Group();g.visible=false;scene.add(g);build(g);g.userData.final=g.position.clone();parts[id]=g;return g;}
function fastener(id,pos,axis,len,d,mat){ // pos: plan head position when seated; axis: plan unit vector pointing INTO the material
  const g=new THREE.Group(); g.visible=false; scene.add(g);
  const shank=new THREE.Mesh(new THREE.CylinderGeometry(d/2,d/2,len,10),mat||M.bolt); shank.position.y=-len/2; g.add(shank);
  const head=new THREE.Mesh(new THREE.CylinderGeometry(d*1.1,d*1.1,d*0.6,12),mat||M.bolt); head.position.y=d*0.3; g.add(head);
  const a=P(axis[0],axis[1],axis[2]).sub(P(0,0,0)).normalize();
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0),a);
  g.position.copy(P(pos[0],pos[1],pos[2])); g.userData.final=g.position.clone(); g.userData.axis=a;
  (fast[id]=fast[id]||[]).push(g); return g;
}
const lag=(id,x,y,z,ax)=>fastener(id,[x,y,z],ax||[0,1,0],4,0.375);
const tap=(id,x,y,z)=>fastener(id,[x,y,z],[0,0,-1],2.75,0.25,M.zinc);
const carriage=(id,x,y,z)=>fastener(id,[x,y,z],[0,1,0],7,0.5);
const screw=(id,x,y,z,ax)=>fastener(id,[x,y,z],ax,3,0.2,M.zinc);
const thru=(id,x,y,z,ax)=>fastener(id,[x,y,z],ax,3,0.5);

// S1 ledgers, winch plate, brace cleat
part('ledgers',g=>{ for(const z of [46,84]) pbox(g,15.75,ledgY,z,96,1.5,3.5,M.pine); pbox(g,R.X/2-18,ledgY,96,36,1.5,7.25,M.pine); });
for(const z of [47.75,85.75]) for(let x=16.75;x<=112;x+=16) lag('ledgers',x,ledgY,z);
for(const x of [R.X/2-8,R.X/2+8]) for(const z of [98,101.5]) lag('ledgers',x,ledgY,z);
// S2 uprights + carriage bolts
part('uprights',g=>{ pbox(g,xUpL,upY0,0,upT,upD,90,M.pine); pbox(g,xUpR,upY0,0,upT,upD,90,M.pine);
  for(const x of [xUpL+0.75,xUpR+0.75]) for(const z of [47,49,85,87]){ const h=new THREE.Mesh(new THREE.CylinderGeometry(0.27,0.27,upD+0.4,12),M.holeM); h.rotation.x=Math.PI/2; h.position.copy(P(x,upY0+upD/2,z)); g.add(h);} });   // 1/2 in carriage bolt holes
for(const x of [xUpL+0.75,xUpR+0.75]) for(const z of [47,49,85,87]) carriage('uprights',x,upY0+2,z);
// S3 chalk line, carpet cut, pads, pillow blocks, tapcons
part('layout',g=>{ const geo=new THREE.BufferGeometry().setFromPoints([P(2,axY,0.3),P(R.X-2,axY,0.3)]); g.add(new THREE.Line(geo,M.chalk));
  for(const x of [padXL,padXR]) pbox(g,x-1,axY-5.6,-0.45,14,11.2,0.46,M.slab,false); });
part('pads',g=>{ for(const x of [padXL,padXR]){ pbox(g,x,axY-3.625,0,10,7.25,1.5,M.pine); pbox(g,x,axY-3.625,1.5,10,7.25,1.5,M.pine); } });   // two 2x8 layers, glued and screwed
for(const x of [padXL,padXR]) for(const dx of [1.5,5,8.5]) for(const dy of [-2.4,2.4]) fastener('pads',[x+dx,axY+dy,padH],[0,0,-1],4.0,0.25,M.zinc);   // 1/4 x 4 in Tapcons through both layers
part('pillows',g=>{ for(const x of [pbXL,pbXR]){ pbox(g,x,axY-2.75,padH,1.5,5.5,1.6,M.steel); const h=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,1.5,20),M.steel); h.rotation.z=Math.PI/2; h.position.copy(P(x+0.75,axY,axZ)); g.add(h);} });
for(const x of [pbXL,pbXR]) for(const dy of [-2.06,2.06]) thru('pillows',x+0.75,axY+dy,padH+1.8,[0,0,-1]);
// S4 winch, fairlead, arm, brace, pulley
// ---------- lift: two 12 V linear actuators (6000 N, 18 in stroke) in the gaps beside the box ends ----------
const actBack=10.5, actUp=36, actOut=12;                       // anchor pin: 10.5 in behind the axle on the upright's inner face, 36 in above it; box pin 12 in out from the axle at axle height
const actX=[bedX0-1.5, bedX0+boxAlong+1.5];                   // actuator centrelines, 1.5 in off the box ends, in the 3 in gaps
part('lift',g=>{
  for(const [k,x] of actX.entries()){ const inner = k===0;
    pbox(g, inner? x-0.75+0.0 : x-0.75, axY+actBack-2, axZ+actUp-2, 1.5,4,4, M.steel);                                      // anchor tab on the upright face (1/4 in steel, two 1/2 in bolts)
    pbox(g, inner? x+0.25 : x-1.75, axY+actBack-1, axZ+actUp-1, 1.5,2,2, M.zinc); }                                          // clevis pin boss
  pbox(g, 96, ledgY-2.5, 44, 6,2.5,3.5, M.black);                                                                           // 12 V 10 A power supply on the lower ledger
  pbox(g, 116, R.Y-0.6, 13, 2.75,0.6,4.5, M.white);                                                                           // wall receptacle (assumed location: verify)
  pbox(g, xUpR+upT, upY0-0.9, 46, 0.9,0.9,2.2, M.black);                                                                      // momentary DPDT rocker on the right upright, bedside height
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([P(99,ledgY-0.3,44),P(117,ledgY-0.3,44),P(117,R.Y-0.3,17)]),M.cord));   // 120 V cord to the receptacle
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([P(96,ledgY-0.3,46),P(xUpR+0.75,ledgY-0.3,46),P(xUpR+0.75,upY0-0.3,46)]),M.cord));   // low-voltage to the switch
  for(const x of actX) g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([P(xUpR+0.75,upY0-0.3,46),P(x,axY+actBack,axZ+actUp+2)]),M.cord));       // switch to each actuator
});

// S5 frame (right side up, in place): rails, joists, blocking
const bedG=new THREE.Group(); scene.add(bedG);       // everything that swings
const pivot=new THREE.Group(); pivot.position.copy(P(bedX0,axY,axZ)); bedG.add(pivot);
const bed=new THREE.Group(); bed.position.set(0,-axUp,-axIn); pivot.add(bed);
function bpart(id,build){const g=new THREE.Group();g.visible=false;bed.add(g);build(g);g.userData.final=g.position.clone();g.userData.local=true;parts[id]=g;return g;}
function bbox(g,x,y,z,dx,dy,dz,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(dx,dy,dz),mat);m.position.set(x+dx/2,y+dy/2,z+dz/2);m.castShadow=m.receiveShadow=true;g.add(m);return m;}   // bed local: x along, y up, z out
bpart('actbrackets',g=>{ for(const x of [-1.5,boxAlong]){ bbox(g,x,axUp-2,axIn+actOut-2,1.5,4,4,M.steel); bbox(g,x<0?x-0.25:x+1.5,axUp-0.75,axIn+actOut-0.75,0.25,1.5,1.5,M.zinc);} });   // 1/4 in steel angle on each end rail, pin 12 in out
for(const [k,x] of actX.entries()) for(const dz of [-1.2,1.2]) thru('lift', k===0? x+0.75 : x-0.75, axY+actBack+1.2, axZ+actUp+dz, [k===0?-1:1,0,0]);   // bracket bolts into the uprights
// actuator bodies, updated every frame from the bed angle
const actTubes=[], actRods=[];
for(const x of actX){ const tube=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,20,16),M.steel); const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,1,12),M.zinc); tube.visible=rod.visible=false; tube.castShadow=rod.castShadow=true; scene.add(tube); scene.add(rod); actTubes.push(tube); actRods.push(rod); }
function updateActuators(on){ actTubes.forEach(t=>t.visible=on); actRods.forEach(r=>r.visible=on); if(!on) return;
  bed.updateWorldMatrix(true,false);
  for(const [k,x] of actX.entries()){ const A=P(x, axY+actBack, axZ+actUp); const B=bed.localToWorld(new THREE.Vector3(k===0?-0.75:boxAlong+0.75, axUp, axIn+actOut)); const d=B.clone().sub(A); const L=d.length(); const u=d.clone().normalize();
    const tube=actTubes[k]; tube.position.copy(A.clone().add(u.clone().multiplyScalar(10))); tube.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),u);
    const rod=actRods[k]; const rl=Math.max(1,L-19); rod.scale.set(1,rl,1); rod.position.copy(A.clone().add(u.clone().multiplyScalar(19+rl/2))); rod.quaternion.copy(tube.quaternion); }
}// profile prism in the bed frame: pts are (s,u) pairs, extruded along x from x0 for len
function prism(g,pts,x0,len,mat){ const sh=new THREE.Shape(); sh.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) sh.lineTo(pts[i][0],pts[i][1]); sh.closePath();
  const geo=new THREE.ExtrudeGeometry(sh,{depth:len,bevelEnabled:false}); const m=new THREE.Mesh(geo,mat); m.rotation.y=-Math.PI/2; m.position.x=x0+len; m.castShadow=m.receiveShadow=true; g.add(m); return m; }
// drilled hole marker: dark cylinder through the part
function hole(g,pos,axis,d,len){ const h=new THREE.Mesh(new THREE.CylinderGeometry(d/2,d/2,len,16),M.holeM); const a=new THREE.Vector3(...axis).normalize(); h.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),a); h.position.set(...pos); g.add(h); return h; }
const bevA=1.0, bevB=0.38;                                   // relief bevel: 1 in up the end face to 3/8 in up at 2 in in (chord of the 3.57 in clearance circle)
const endRail=[[0,bevA],[axIn,bevB],[axIn,0],[boxOut,0],[boxOut,boxH],[0,boxH]];
const wallRail=[[0,bevA],[1.5,bevA-(bevA-bevB)*1.5/axIn],[1.5,boxH],[0,boxH]];
bpart('rails',g=>{ prism(g,endRail,0,1.5,M.pine); prism(g,endRail,boxAlong-1.5,1.5,M.pine); prism(g,wallRail,1.5,boxAlong-3,M.pine); bbox(g,1.5,0,boxOut-1.5,boxAlong-3,boxH,1.5,M.pine);
  for(const x of [0.75,boxAlong-0.75]){ hole(g,[x,axUp,axIn],[1,0,0],1.0625,1.7); for(const u of [axUp-1.95,axUp+1.95]) hole(g,[x,u,axIn],[1,0,0],0.5,1.7); }   // axle hole + two flange bolt holes per end rail
  for(const x of [14,41,68]) hole(g,[x,4.6,boxOut-0.75],[0,0,1],0.5,1.7); });                                                                            // strap eye bolt holes in the far rail
bpart('gussets',g=>{ for(const [cx,cz,rot] of [[1.5,1.5,-Math.PI/4],[boxAlong-1.5,1.5,Math.PI/4],[1.5,boxOut-1.5,Math.PI/4],[boxAlong-1.5,boxOut-1.5,-Math.PI/4]]){ const m=new THREE.Mesh(new THREE.BoxGeometry(15,1.5,3.5),M.pine); m.rotation.y=rot; m.position.set(cx+(cx<40?5.3:-5.3),boxH-0.75-1.5,cz+(cz<40?5.3:-5.3)); m.castShadow=true; g.add(m);} });   // four 2x4 corner gussets, 45 deg ends, under the deck: stop the bare frame racking on the first lift
bpart('joists',g=>{ for(const z of [20,41,62]) bbox(g,1.5,boxH-3.5,z-0.75,boxAlong-3,3.5,1.5,M.pine); for(const x of [1.5,21.5,41.5]) bbox(g,x,boxH-3.5,41.75,Math.min(19,boxAlong-1.5-x),3.5,1.5,M.pine); });   // three 2x4 joists + mid blocking

 do:['Press UP. The actuators push the bare frame to vertical in about 90 s; both people spot from the sides, never under it. Past about 84 deg gravity leans it into the wall and the actuators hold it back; they are self-locking, so letting go of the switch stops it anywhere.','With it standing, clamp the two 2x6 x 22 in keeper arms to each upright\'s inner face so they project into the room beside the box ends, at 58 and 78 in. Screw the rubber stop blocks to the arm tips where the deck edge lands, set them so the frame is plumb and the actuators reach their own end stop at the same moment (shim the stop blocks until they do), then lag the arms. Fit a heavy hasp on each end rail that drops over a staple on the arm.','Press DOWN to lower. The actuators pull the frame out past over-center and lower it under control the whole way; nothing goes slack.'],

{t:'11. Safety straps and bottom stop',cam:C(8,50,50,30,140,40),parts:['safety'],fast:[],people:'1',tools:'1 in webbing, carabiners, eye screws',

{t:'12. Head lip',cam:C(6,106,40,28,135,21),parts:['headboard'],fast:[],cutsL:[[[2,boxH+deck+3,1.1],[boxAlong-2,boxH+deck+3,1.1]]],people:'1',tools:'glue, 1-1/4 in screws, 1/2 in bit',

{t:'X-ray: watch everything move',cam:C(8,-20,40,30,133,30),parts:[],fast:[],swing:true,xray:true,people:'',tools:'',
 do:['Everything is translucent and the bed swings slowly. The red circle at each end is the 3-9/16 in clearance circle about the axle; the bevelled head-end corner rides on it, 3/8 in above the carpet pile (grey line) at every angle. It never touches the floor, so it never levers on it.','Why it is one clean circle and not a half-orbit: the stubs sit in bearings bolted to the slab, so the box can only rotate about that fixed line. Every point on the bed draws a circle around the axle. A bed with no axle tipped up on its edge would roll on the floor and its centre would wander; that is the motion you were picturing, and the axle is exactly what removes it.','Watch the keeper arms, the stop blocks, the pillow blocks and the two actuators as the bed passes: the same geometry was swept in the solid checker at 2 deg steps with no hard intersections. Drag to orbit while it swings; the X-ray button at the bottom works in any step.'],

{t:'Done: paint the face',cam:C(63,-130,60,63,120,45),parts:[],fast:[],swing:true,people:'',tools:'',
 do:['Stand the bed up and the painted face is a wall. Practice the rainy street on a small panel first, then paint the real one in place.'],

];
// cumulative visibility: all parts of steps <= i are shown
const panel=document.getElementById('panel'), hud=document.getElementById('hud'), stepsBar=document.getElementById('steps');
steps.forEach((s,i)=>{const b=document.createElement('button'); b.textContent=i; b.title=s.t; b.addEventListener('click',()=>go(i)); stepsBar.appendChild(b);});
let cur=-1, anims=[], tools=[], camFrom=null, camTo=null, camT=1, swingA=0, playing=false, dwell=0;
let tgt=P(63,100,40); camera.position.copy(P(63,-120,70)); camera.lookAt(tgt);
function ease(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function go(i){
  i=Math.max(0,Math.min(steps.length-1,i)); const forward=i>cur; cur=i; const s=steps[i];
  // visibility
  Object.values(parts).forEach(g=>g.visible=false); Object.values(fast).flat().forEach(f=>f.visible=false);
  for(let k=0;k<=i;k++){ if(steps[k].once && k!==i) continue; steps[k].parts.forEach(id=>parts[id].visible=true); steps[k].fast.forEach(id=>(fast[id]||[]).forEach(f=>f.visible=true)); }
  anims=[]; tools.forEach(o=>scene.remove(o)); tools=[]; const now=performance.now();
  let lead=0;
  if(forward){
    // cuts and drilled holes first: a red blade sweeps each cut line, a drill bit dives into each hole
    bed.updateWorldMatrix(true,false);
    const toW=(v,local)=> local? bed.localToWorld(new THREE.Vector3(v[0],v[1],v[2])) : P(v[0],v[1],v[2]);
    const cuts=(s.cuts||[]).map(c=>[toW(c[0]),toW(c[1])]).concat((s.cutsL||[]).map(c=>[toW(c[0],true),toW(c[1],true)]));
    const drills=(s.drills||[]).map(d=>[toW(d),new THREE.Vector3(...d[3])]).concat((s.drillsL||[]).map(d=>[toW(d,true),bed.localToWorld(new THREE.Vector3(...d[3])).sub(bed.localToWorld(new THREE.Vector3(0,0,0))).normalize()]));
    cuts.forEach(([a,b])=>{ const blade=new THREE.Mesh(new THREE.BoxGeometry(2.4,2.4,0.4),M.blade); blade.visible=false; scene.add(blade); tools.push(blade);
      const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a.clone(),a.clone()]),M.cut); scene.add(line); tools.push(line);
      anims.push({t0:now+lead,d:550,fn:u=>{ blade.visible=u<1; blade.position.lerpVectors(a,b,u); line.geometry.setFromPoints([a,a.clone().lerp(b,u)]); }}); lead+=600; });
    drills.forEach(([pos,ax])=>{ const bit=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,6,10),M.zinc); bit.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),ax.clone().negate()); bit.visible=false; scene.add(bit); tools.push(bit);
      const start=pos.clone().sub(ax.clone().multiplyScalar(5)), end=pos.clone().sub(ax.clone().multiplyScalar(1.6));
      anims.push({t0:now+lead,d:420,fn:u=>{ bit.visible=u<1; const k=u<0.6? u/0.6 : 1-(u-0.6)/0.4; bit.position.lerpVectors(start,end,k); }}); lead+=300; });
    if(cuts.length||drills.length) lead+=300;
    s.parts.forEach((id,n)=>{ const g=parts[id]; const off=new THREE.Vector3(0,30,0); g.position.copy(g.userData.final).add(off); anims.push({g,from:g.position.clone(),to:g.userData.final.clone(),t0:now+lead+n*250,d:1100}); });
    let n=0; s.fast.forEach(id=>(fast[id]||[]).forEach(f=>{ f.position.copy(f.userData.final).add(f.userData.axis.clone().multiplyScalar(-6)); anims.push({g:f,from:f.position.clone(),to:f.userData.final.clone(),t0:now+lead+1100+n*140,d:320}); n++; }));
  } else { Object.values(parts).forEach(g=>g.position.copy(g.userData.final)); Object.values(fast).flat().forEach(f=>f.position.copy(f.userData.final)); }
  camFrom={eye:camera.position.clone(),tgt:tgt.clone()}; camTo=s.cam; camT=0;
  // swing state: steps 8, 9 raise the frame; others down; final step animates
  swingTarget = (i===9||i===10)? 90 : 0; swingLoop = !!s.swing; swingSlow = !!s.xray; foldDemo = s.demo==='fold'; foldT=0; if(!!s.xray!==xray) setXray(!!s.xray);
  const nF=s.fast.reduce((a,id)=>a+(fast[id]||[]).length,0);
  panel.innerHTML=`<div class="n">Step ${i} of ${steps.length-1}</div><h2>${s.t}</h2>
   <h3>Do</h3><ul>${s.do.map(x=>`<li>${x}</li>`).join('')}</ul>
   <h3>Check before moving on</h3><ul class="check">${s.check.map(x=>`<li>${x}</li>`).join('')}</ul>
   <div class="meta">${s.people?`<span class="chip">People: ${s.people}</span>`:''}${s.tools?`<span class="chip">Tools: ${s.tools}</span>`:''}${nF?`<span class="chip">${nF} fasteners</span>`:''}${i===1?'<span class="chip w">Assumptions to verify</span>':''}${(s.cuts||s.cutsL)?`<span class="chip">${(s.cuts||[]).length+(s.cutsL||[]).length} cuts</span>`:''}${(s.drills||s.drillsL)?`<span class="chip">${(s.drills||[]).length+(s.drillsL||[]).length} holes</span>`:''}</div>`;
  panel.scrollTop=0;
  hud.textContent=`Step ${i}: ${s.t}`+(s.xray?'  ·  head-corner clearance to carpet pile: 0.38 in at every angle (checker)':'');
  stepsBar.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('on',k===i));
  dwell=0;
}
let swingTarget=0, swingLoop=false, swingDir=1, foldDemo=false, foldT=0, swingSlow=false;
document.getElementById('prev').addEventListener('click',()=>{playing=false;play.textContent='Play all';go(cur-1);});
document.getElementById('next').addEventListener('click',()=>{playing=false;play.textContent='Play all';go(cur+1);});
const play=document.getElementById('play'); play.addEventListener('click',()=>{ playing=!playing; play.textContent=playing?'Pause':'Play all'; if(playing&&cur>=steps.length-1) go(0); });
document.getElementById('t-studs').addEventListener('click',e=>{e.target.classList.toggle('on'); studs.visible=e.target.classList.contains('on');});
document.getElementById('t-dims').addEventListener('click',e=>{e.target.classList.toggle('on'); dims.visible=e.target.classList.contains('on');});
// X-ray: every mesh translucent, clearance circles and floor lines drawn in the gaps
const xrayG=new THREE.Group(); xrayG.visible=false; scene.add(xrayG);
{ const R0=axZ-0.5-0.375; for(const x of [bedX0-0.4, bedX0+boxAlong+0.4]){ const pts=[]; for(let i=0;i<=72;i++){ const a=i/72*Math.PI*2; pts.push(P(x, axY+R0*Math.cos(a), axZ+R0*Math.sin(a))); } xrayG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),M.path)); }
  xrayG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([P(bedX0-8,axY-12,0.5),P(bedX0+boxAlong+8,axY-12,0.5)]),new THREE.LineBasicMaterial({color:0x6b6b6b})));
  xrayG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([P(bedX0-8,axY+6,0.5),P(bedX0+boxAlong+8,axY+6,0.5)]),new THREE.LineBasicMaterial({color:0x6b6b6b}))); }
let xray=false; const matSeen=new Set();
function setXray(on){ xray=on; xrayG.visible=on; document.getElementById('t-xray').classList.toggle('on',on);
  scene.traverse(o=>{ if(!o.isMesh||!o.material) return; const m=o.material; if(!matSeen.has(m)){ matSeen.add(m); m.userData.op=m.opacity; m.userData.tr=m.transparent; }
    if(on){ m.transparent=true; m.opacity=(m===M.wall||m===M.carpet||m===M.slab||m===M.stud)?0.12:0.42; m.depthWrite=false; } else { m.transparent=m.userData.tr; m.opacity=m.userData.op; m.depthWrite=true; } }); }
document.getElementById('t-xray').addEventListener('click',()=>setXray(!xray));
// orbit
let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointerup',()=>drag=null);
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=(e.clientX-drag.x)*0.005,dy=(e.clientY-drag.y)*0.005;drag={x:e.clientX,y:e.clientY};camT=1;const off=camera.position.clone().sub(tgt);const sph=new THREE.Spherical().setFromVector3(off);sph.theta-=dx;sph.phi=Math.min(Math.PI-0.05,Math.max(0.05,sph.phi+dy));off.setFromSpherical(sph);camera.position.copy(tgt).add(off);camera.lookAt(tgt);});
canvas.addEventListener('wheel',e=>{e.preventDefault();camT=1;const off=camera.position.clone().sub(tgt);off.multiplyScalar(1+Math.sign(e.deltaY)*0.08);if(off.length()>15&&off.length()<900){camera.position.copy(tgt).add(off);camera.lookAt(tgt);}},{passive:false});

function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==w||canvas.height!==h){renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}}
let last=performance.now();
function frame(t){const dt=Math.min(0.05,(t-last)/1000);last=t;resize();
  // part / fastener animations
  let busy=false; anims.forEach(a=>{const u=(t-a.t0)/a.d; if(a.fn){ if(u<0){busy=true;} else if(u<1){a.fn(u);busy=true;} else a.fn(1); return; } if(u<0){a.g.position.copy(a.from);a.g.visible=false;busy=true;} else if(u<1){a.g.visible=true;a.g.position.lerpVectors(a.from,a.to,ease(u));busy=true;} else {a.g.visible=true;a.g.position.copy(a.to);}});
  // camera
  if(camT<1){camT=Math.min(1,camT+dt/1.2);const k=ease(camT);camera.position.lerpVectors(camFrom.eye,camTo.eye,k);tgt.lerpVectors(camFrom.tgt,camTo.tgt,k);camera.lookAt(tgt);}
  // swing
  if(swingLoop){ swingA+=swingDir*(swingSlow?9:20)*dt; if(swingA>=90){swingA=90;swingDir=-1;} if(swingA<=0){swingA=0;swingDir=1;} }
  else { const d=swingTarget-swingA; if(Math.abs(d)>0.1){swingA+=Math.sign(d)*Math.min(Math.abs(d),25*dt);busy=true;} else swingA=swingTarget; }
  pivot.rotation.x=-THREE.MathUtils.degToRad(swingA);
     // folds forward onto the mattress; step 12 loops a fold demo
  updateRope(false); updateActuators(parts.actbrackets && parts.actbrackets.visible);
  if(playing){ if(!busy){ dwell+=dt; if(dwell>7){ if(cur<steps.length-1) go(cur+1); else {playing=false;play.textContent='Play all';} } } }
  renderer.render(scene,camera); requestAnimationFrame(frame);}
go(0); requestAnimationFrame(frame);
})();
